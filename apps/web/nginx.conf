# Nginx que sirve la SPA (build estático de Vite). Ligero y seguro para una SPA.
# El reverse proxy externo (Nginx Proxy Manager, tarea 09) pone HTTPS/SSL delante;
# este nginx interno solo sirve los ficheros.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Cabeceras de seguridad ----
    # La API ya las manda vía helmet, pero eso NO cubre la web: helmet solo toca las
    # respuestas de NestJS, y el HTML/JS que ejecuta el navegador sale de aquí. Sin
    # esto la SPA iba sin CSP ni protección anti-clickjacking.
    #
    # `always` para que se envíen también en respuestas de error (404, 5xx). OJO: un
    # `add_header` dentro de un location DESCARTA todos los heredados del server, por
    # eso el bloque /assets/ de abajo no usa ninguno.

    # Política de contenido: el freno real contra XSS. Si algún día se cuela HTML
    # ajeno, el navegador no ejecutará scripts de fuera de esta lista.
    #   script-src  → solo lo nuestro + el script del CAPTCHA (Turnstile).
    #   style-src   → 'unsafe-inline' es obligatorio: React escribe atributos style
    #                 en línea y Tailwind inyecta estilos en runtime. Los estilos en
    #                 línea no permiten ejecutar código, así que el riesgo es bajo.
    #   img-src     → https: genérico porque las fotos las sirve la API, cuyo dominio
    #                 varía por entorno y no se conoce al construir la imagen.
    #   connect-src → igual: fetch a la API + WebSocket de las subastas (wss:).
    #   frame-ancestors 'none' → nadie puede meternos en un iframe (clickjacking);
    #                 sustituye a X-Frame-Options, que se mantiene por navegadores viejos.
    #   form-action / base-uri → impiden reapuntar formularios o URLs relativas a otro sitio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # No adivinar el tipo de un fichero por su contenido: evita que una imagen
    # subida se acabe interpretando como script.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # No filtrar la URL completa (que puede llevar ids de pedido) a terceros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Apagamos APIs del navegador que esta web no usa.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS: obliga a HTTPS en visitas siguientes. Los navegadores lo ignoran si la
    # respuesta no viaja ya por HTTPS, así que es inocuo detrás del proxy en dev.
    # Sin includeSubDomains a propósito: afectaría a subdominios que quizá no tengan
    # certificado (dejaría inaccesibles).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Ocultar la versión de nginx en las respuestas y páginas de error.
    server_tokens off;

    # SPA: cualquier ruta desconocida devuelve index.html para que el router del
    # cliente (React Router) resuelva la navegación. Sin esto, recargar en
    # /productos/xxx daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo largo de los assets con hash en el nombre (los genera Vite); son
    # inmutables, así que se pueden cachear de forma agresiva. Se usa solo `expires`
    # (que emite Cache-Control: max-age) y NO `add_header`, porque un add_header aquí
    # anularía todas las cabeceras de seguridad de arriba para estos ficheros.
    location /assets/ {
        expires 1y;
    }
}
